<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Classification Test</title>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Arial, sans-serif;
      background-color: #f4f1ec;
      color: #222222;
    }

    .test-container {
      width: 90%;
      max-width: 700px;
      padding: 50px;
      text-align: center;
      background-color: white;
      border: 1px solid #222222;
    }

    h1 {
      font-size: 32px;
    }

    p {
      line-height: 1.6;
    }

    button {
      margin-top: 24px;
      padding: 12px 28px;
      border: none;
      background-color: #222222;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background-color: #555555;
    }
  </style>
</head>

<body>
  <main class="test-container">
    <h1>Classification Test</h1>

    <p>
      This reaction-time classification test explores how gender categories
      are constructed through everyday judgments.
    </p>

    <p>
      The experience is speculative and does not provide a psychological
      diagnosis.
    </p>

    <button id="start-button">Start Test</button>
  </main>

  <script>
    const startButton = document.getElementById("start-button");

    startButton.addEventListener("click", function () {
      alert("Start!");
    });
  </script>
</body>
</html>
